# What every protocol here is written against and no protocol owns: the
# `Client` a protocol implements, the `Handler` its thread calls, the
# `Callbacks` a platform answers it with, the `Runner` that runs one on its own
# thread and the `Bridge` between them, the connections a session makes
# (`net`, which a platform may supply) and the dial a hang-up interrupts, the
# pinned TLS of the protocols that use it, and the address parser, which every
# client runs before any of that. And what a platform implements: the picture
# and the sound a session carries (`src/media/`), whose video decoders and
# sound outputs a platform supplies by implementing `media::video::Decoders`
# and `media::audio::Outputs`, and the processing of their planes and samples,
# the same on both platforms.
#
# Nothing here is Android-specific. The Android half of a backend is
# `remotedesktop-platform-android`, which depends on this crate and not the
# other way round, so a desktop client can be built on this layer without
# `jni` anywhere in its graph.
[package]
name = "remotedesktop-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "runtime"

[dependencies]
log.workspace = true
# The dial a disconnect can interrupt (`src/net/`): a socket made before it
# connects, which std does not offer, and the `poll` that waits on it and
# relays a socketpair. Both were in the lock already: RustDesk dials with
# socket2, and libc is under most of what is here.
socket2 = "0.6"
libc = "0.2"
# TLS for the protocols that use it (`src/tls/`): the pin, which is a SHA-256
# of the certificate, and the connection two threads share. `ring` because
# aws-lc-rs needs cmake and bindgen for Android. No `webpki-roots`: a pin
# takes the place of a certificate authority here.
#
# A dependency of every crate that depends on this one, including protocols
# that use no TLS, and named on each such artefact's licence page, since the
# page is generated from the dependency graph and not from what the linker
# kept: a library that never calls into `tls` carries none of it.
sha2 = "0.11"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }

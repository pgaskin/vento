# The libvncclient backend's `Kind`, built on the shared adapter for the C
# backends (`remotedesktop-api`'s `c` feature), with this backend's config,
# live options and info rows. The C library is the shim in `cpp/` over
# LibVNCServer's client half, built by Meson. The Linux client opens it at
# run time (`api::c::library`) and the phone's library links it together with
# this crate. This crate does not link it, so there is no test binary.
[package]
name = "remotedesktop-libvnc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "remotedesktop_libvnc"
test = false
doctest = false

[dependencies]
log.workspace = true
remotedesktop-api = { workspace = true, features = ["c"] }

# On Linux, the function table build.rs generates from the header uses this
# for dlopen and dlsym, and for an error naming the call that failed. Already
# a dependency through bindgen's libclang.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

# The phone's half: the shared JNI layer, registered on this module's
# generated natives class by the `JNI_OnLoad` in `src/lib.rs`. The app loads
# the library Meson links; this crate goes into it as a static library
# (`CargoBuildTask` with `crateType = 'staticlib'`).
[target.'cfg(target_os = "android")'.dependencies]
remotedesktop-platform-android.workspace = true

[build-dependencies]
# Generates the bindings to `vento/libvnc.h` (build.rs), as the `api` crate
# does for the shared headers.
bindgen.workspace = true

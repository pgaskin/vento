# The RealVNC backend for the Linux client: its `Kind` over the shared adapter
# for the C backends (`remotedesktop-api`'s `c` feature), with this backend's
# config, live options, info rows and security prompt. The library is
# `vento_realvnc`: the session in `cpp/` over the hosting layer in
# `cpp/host/`, which runs RealVNC's Android viewer core in a glibc process.
# The client's build compiles it with Meson along with the other C backends,
# and only under clang.
#
# For that reason it is loaded rather than linked (`src/linux.rs`): whether the
# library exists is known only after the client's build script has run Meson,
# too late to be a feature of this crate. This crate always builds, and opens
# `libvento_realvnc.so` when a session needs it, or reports why it cannot.
#
# The phone's RealVNC backend is the module's Java over the viewer's own JNI,
# in the add-on. There this crate is only the session's network for the
# module's native library, which links it as a static library
# (`src/android.rs`); on any other target it is empty.
[package]
name = "remotedesktop-realvnc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "remotedesktop_realvnc"
doctest = false

[target.'cfg(target_os = "linux")'.dependencies]
log.workspace = true
remotedesktop-api = { workspace = true, features = ["c"] }
# Used by bindgen's generated loader for the header's functions (build.rs)
# for dlopen, dlsym and errors naming the failed call. Already in the
# dependency graph through bindgen's libclang.
libloading = "0.8"

# The phone's side: the session's network for the module's native library,
# which links this crate as a static library (`android.rs`).
[target.'cfg(target_os = "android")'.dependencies]
remotedesktop-api = { workspace = true, features = ["c"] }
remotedesktop-runtime.workspace = true
remotedesktop-platform-android.workspace = true

[build-dependencies]
# Generates the bindings for `vento/realvnc.h` (build.rs) instead of
# retyping them, as the `api` crate does for the shared headers and each C
# backend's crate for its own.
bindgen.workspace = true

plugins {
    id 'com.android.library'
}

// Both halves of the RFB backend: the crate at this directory's root
// (`Cargo.toml`, `src/`), our own client, built as the library the AAR carries,
// and the provider in `java/`, which holds a session on it as a
// `NativeBackend` through the natives class generated below.
android {
    namespace = 'net.pgaskin.remotedesktop.backend.rfb'
    compileSdk 36
    ndkVersion = project(':backends').nativeNdkVersion

    defaultConfig {
        minSdk 31
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // Not AGP's `src/main/`: `src/` here is the crate's. The Java is in
    // `java/` without package directories (javac uses the `package` line), and
    // the provider's registration is in `resources/`.
    sourceSets.main {
        java.srcDirs = ['java']
        resources.srcDirs = ['resources']
    }

    // The AAR includes the library too, so RFB support is one dependency line.
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // The only project of the app's this module may depend on. `api` because
    // a session here is a `Backend`, and its users need that type.
    api project(':backends')
}

// `libremotedesktop_rfb.so`, built by cargo-ndk into a generated jniLibs
// directory the AAR packages. Every variant: both flavours include this client.
androidComponents {
    onVariants(selector().all()) { variant ->
        final cap = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) + variant.name.substring(1)
        final backends = project(':backends')

        final cargoBuild = tasks.register("cargoBuild${cap}Native", CargoBuildTask) {
            workspaceDir.set(backends.cargoWorkspace)
            cargoPackage.set('remotedesktop-rfb')
            ndkDirectory.set(androidComponents.sdkComponents.ndkDirectory)
            rustToolchainFile.set(backends.cargoRustToolchain)
            cargoNdkVersion.set(backends.cargoNdkVersion)
            abiFilters.set(backends.nativeAbis)
            minSdkVersion.set(provider {
                final v = android.defaultConfig.minSdk
                (v instanceof com.android.build.api.variant.AndroidVersion) ? v.apiLevel : v
            })
            outputDir.set(layout.buildDirectory.dir("generated/rustNativeLibs/${variant.name}"))
        }
        variant.sources.jniLibs?.addGeneratedSourceDirectory(cargoBuild) { it.outputDir }

        // Generates `RfbCatalog` (this backend's catalog entry) and `RfbNatives`
        // (the class the library registers its natives on): see :backends.
        backends.generateCatalog(project, variant, 'rfb', 'RfbCatalog')
        backends.generateNatives(project, variant, 'RfbNatives', 'remotedesktop_rfb')
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

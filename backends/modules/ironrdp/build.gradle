plugins {
    id 'com.android.library'
}

// Both halves of the IronRDP backend: the crate at this directory's root
// (`Cargo.toml`, `src/`), built as the library the AAR carries, and the
// provider in `java/`, which wraps a session on it in a `NativeBackend`
// through the natives class generated below.
android {
    namespace = 'net.pgaskin.remotedesktop.backend.ironrdp'
    compileSdk 36
    ndkVersion = project(':backends').nativeNdkVersion

    defaultConfig {
        minSdk 31
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // Not AGP's `src/main/`: `src/` here is the crate's. The Java files are
    // directly in `java/` without package directories (javac uses the
    // `package` line), and the provider's registration is in `resources/`.
    sourceSets.main {
        java.srcDirs = ['java']
        resources.srcDirs = ['resources']
    }

    // The AAR carries the library as well as the Java, so including this
    // backend in a build takes one dependency line.
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // The backend interface, and the only part of the app this module may
    // reference. `api` because this module's sessions are exposed as
    // `Backend`s, so dependents need the type.
    api project(':backends')
}

// `libremotedesktop_ironrdp.so`, compiled by cargo-ndk into a generated jniLibs
// directory the AAR packages. Every variant: both flavours get this client.
androidComponents {
    onVariants(selector().all()) { variant ->
        final cap = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) + variant.name.substring(1)
        final backends = project(':backends')

        final cargoBuild = tasks.register("cargoBuild${cap}Native", CargoBuildTask) {
            workspaceDir.set(backends.cargoWorkspace)
            cargoPackage.set('remotedesktop-ironrdp')
            ndkDirectory.set(androidComponents.sdkComponents.ndkDirectory)
            rustToolchainFile.set(backends.cargoRustToolchain)
            cargoNdkVersion.set(backends.cargoNdkVersion)
            abiFilters.set(backends.nativeAbis)
            minSdkVersion.set(provider {
                final v = android.defaultConfig.minSdk
                (v instanceof com.android.build.api.variant.AndroidVersion) ? v.apiLevel : v
            })
            outputDir.set(layout.buildDirectory.dir("generated/rustNativeLibs/${variant.name}"))
        }
        variant.sources.jniLibs?.addGeneratedSourceDirectory(cargoBuild) { it.outputDir }

        // `IronRdpCatalog`, this backend's catalog entry, and `IronRdpNatives`,
        // the class the library registers its natives on: see :backends.
        backends.generateCatalog(project, variant, 'rdp', 'IronRdpCatalog')
        backends.generateNatives(project, variant, 'IronRdpNatives', 'remotedesktop_ironrdp')
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

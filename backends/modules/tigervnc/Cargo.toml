# The TigerVNC backend's `Kind`, over the shared adapter for the C backends
# (`remotedesktop-api`'s `c` feature), with this backend's own config, live
# options and info rows. The library is the shim in `cpp/` over TigerVNC's
# viewer core, built by Meson. The Linux client opens it at run time
# (`api::c::library`), and on Android it is linked together with this crate.
# This crate never links it, so there is no test binary.
[package]
name = "remotedesktop-tigervnc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "remotedesktop_tigervnc"
test = false
doctest = false

[dependencies]
log.workspace = true
remotedesktop-api = { workspace = true, features = ["c"] }

# On Linux, the function table build.rs generates from the header uses this
# for dlopen and dlsym, and for errors that say which call failed. Already a
# dependency through bindgen's libclang.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

# The Android half: the JNI layer, registered on this module's generated
# natives class from the `JNI_OnLoad` in `src/lib.rs`. The library the app
# loads is still the one Meson links; this crate goes into it as a static
# library (`CargoBuildTask` with `crateType = 'staticlib'`).
[target.'cfg(target_os = "android")'.dependencies]
remotedesktop-platform-android.workspace = true

[build-dependencies]
# `vento/tigervnc.h`, read rather than retyped (build.rs), as the `api` crate
# reads the shared headers.
bindgen.workspace = true

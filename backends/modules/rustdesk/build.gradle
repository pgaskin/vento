plugins {
    id 'com.android.library'
}

// The RustDesk backend has two parts: the crate at this directory's root
// (`Cargo.toml`, `src/`), our own client, built as the library the AAR
// carries; and the provider in `java/`, which holds a session as a
// `NativeBackend` through the natives class generated below. It ships in
// `plugins/rustdesk` rather than in the app.
android {
    namespace = 'net.pgaskin.remotedesktop.backend.rustdesk'
    compileSdk 36
    ndkVersion = project(':backends').nativeNdkVersion

    defaultConfig {
        minSdk 31
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // Not AGP's `src/main/`: `src/` here is the crate's. The Java is in
    // `java/`, with no package directories (javac goes by the `package`
    // line), and the provider's registration is in `resources/`.
    sourceSets.main {
        java.srcDirs = ['java']
        resources.srcDirs = ['resources']
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // The only app project this module may depend on. `api` because sessions
    // here are `Backend`s, so consumers need the type too.
    api project(':backends')
}

// `libremotedesktop_rustdesk.so`, compiled by cargo-ndk into a generated
// jniLibs directory the AAR packages. The add-on's APK carries it, and the
// app loads it from that package's library directory.
androidComponents {
    onVariants(selector().all()) { variant ->
        final cap = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) + variant.name.substring(1)
        final backends = project(':backends')

        final cargoBuild = tasks.register("cargoBuild${cap}Native", CargoBuildTask) {
            workspaceDir.set(backends.cargoWorkspace)
            cargoPackage.set('remotedesktop-rustdesk')
            ndkDirectory.set(androidComponents.sdkComponents.ndkDirectory)
            rustToolchainFile.set(backends.cargoRustToolchain)
            cargoNdkVersion.set(backends.cargoNdkVersion)
            abiFilters.set(backends.nativeAbis)
            minSdkVersion.set(provider {
                final v = android.defaultConfig.minSdk
                (v instanceof com.android.build.api.variant.AndroidVersion) ? v.apiLevel : v
            })
            outputDir.set(layout.buildDirectory.dir("generated/rustNativeLibs/${variant.name}"))
        }
        variant.sources.jniLibs?.addGeneratedSourceDirectory(cargoBuild) { it.outputDir }

        // `RustDeskCatalog`, this backend's catalog entry, and
        // `RustDeskNatives`, the class the library registers its natives on,
        // loaded from the add-on's APK: see :backends.
        backends.generateCatalog(project, variant, 'rustdesk', 'RustDeskCatalog')
        backends.generateNatives(project, variant, 'RustDeskNatives', 'remotedesktop_rustdesk')
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

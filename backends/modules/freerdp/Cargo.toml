# The FreeRDP backend for the clients: its `Kind` over the shared adapter
# for the C backends (`remotedesktop-api`'s `c` feature), with this
# backend's config, live options and info rows. The C library is the shim in
# `cpp/` over libfreerdp, built by Meson. The Linux client opens it at run
# time (`api::c::library`) and the Android library links it together with
# this crate. This crate doesn't link it, so there is no test binary.
[package]
name = "remotedesktop-freerdp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "remotedesktop_freerdp"
test = false
doctest = false

[dependencies]
log.workspace = true
remotedesktop-api = { workspace = true, features = ["c"] }

# On Linux, the function table build.rs generates over the header uses
# libloading (dlopen and dlsym, with an error naming the failed call). It is
# already in the dependency graph through bindgen's libclang.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

# Android: the shared JNI layer, registered on this module's generated
# natives class from `JNI_OnLoad` in `src/lib.rs`. The app loads the library
# Meson links; this crate goes into it as a static library (`CargoBuildTask`
# with `crateType = 'staticlib'`).
[target.'cfg(target_os = "android")'.dependencies]
remotedesktop-platform-android.workspace = true

[build-dependencies]
# Generates the bindings for `vento/freerdp.h` (build.rs), as the `api`
# crate does for the shared headers.
bindgen.workspace = true

# The RDP backend's native half, in the RFB client's shape because `Backend` is
# what both have to fit. Bound rather than written: what is ours is the threads,
# the framebuffer, the keysym map and the trust decision.
[package]
name = "remotedesktop-ironrdp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# `lib` for the tests and the example, `cdylib` for the library the app loads —
# one crate for one protocol. The name is the `.so`'s: librdp.so is too plain a
# name to put in somebody's APK.
name = "remotedesktop_ironrdp"
crate-type = ["lib", "cdylib"]

[dependencies]
log.workspace = true
remotedesktop-common.workspace = true
remotedesktop-tls.workspace = true

# `ironrdp-blocking` rather than the async one: this client owns its threads and
# blocks on a socket, which keeps a tokio runtime out of the app.
#
# A submodule pinned to a commit rather than the published versions, and not by
# preference:
# `ironrdp-session` 0.11.0 chunks a decoded bitmap by the *rectangle's* width
# where the protocol pads the bitmap's own width up to a multiple of four, so
# every update not a multiple of four wide shears one row further left than the
# last. On xrdp that is most of them. Fixed upstream and unreleased — revisit at
# the next release.
ironrdp-cliprdr = { path = "../../../../../third_party/ironrdp/crates/ironrdp-cliprdr" }
ironrdp-blocking = { path = "../../../../../third_party/ironrdp/crates/ironrdp-blocking" }
ironrdp-connector = { path = "../../../../../third_party/ironrdp/crates/ironrdp-connector" }
ironrdp-displaycontrol = { path = "../../../../../third_party/ironrdp/crates/ironrdp-displaycontrol" }
ironrdp-dvc = { path = "../../../../../third_party/ironrdp/crates/ironrdp-dvc" }
ironrdp-core = { path = "../../../../../third_party/ironrdp/crates/ironrdp-core" }
ironrdp-graphics = { path = "../../../../../third_party/ironrdp/crates/ironrdp-graphics" }
ironrdp-input = { path = "../../../../../third_party/ironrdp/crates/ironrdp-input" }
ironrdp-pdu = { path = "../../../../../third_party/ironrdp/crates/ironrdp-pdu" }
ironrdp-session = { path = "../../../../../third_party/ironrdp/crates/ironrdp-session" }
ironrdp-svc = { path = "../../../../../third_party/ironrdp/crates/ironrdp-svc" }

rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
# CredSSP binds the authentication to the TLS certificate's public key, so the
# SubjectPublicKeyInfo has to come out of the DER. A parser rather than an
# offset: this is the one field whose position nobody should guess.
x509-cert = { version = "0.2", default-features = false, features = ["pem"] }

# The only part of this crate that knows a phone exists.
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
android_logger.workspace = true

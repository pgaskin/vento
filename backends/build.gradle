plugins {
    id 'com.android.library'
}

// The interfaces the app holds a backend by (`Backend`, `BackendProvider` and
// the types around them) and nothing else: no androidx, no app class, no
// protocol. A protocol is a module under this one, depending on this and on
// nothing else of the app's, so the compiler checks that each implementation
// needs nothing beyond these interfaces.
android {
    namespace = 'net.pgaskin.remotedesktop.backend'
    compileSdk 36

    defaultConfig {
        minSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // Not AGP's `src/main/`: this project is `backends/` itself, the parent
    // of every module and of the crates, and its Java is the Android half of
    // the platform, so it is with the rest of that in `platform/android/`:
    // the files in `java/`, with no package directories (javac uses the
    // `package` line), and their tests beside it in `javatest/` rather than
    // under it, since a source directory includes everything below it.
    sourceSets {
        main.java.srcDirs = ['platform/android/java']
        test.java.srcDirs = ['platform/android/javatest']
    }

    // `BackendOption.settle` implements the same rule as the Linux client's
    // `api::options::Options::settle`, tested against the same cases:
    // `api/tests/options.json`, which `cargo test` reads too. The tests read
    // it at run time from the module's directory, so the file is declared as
    // an input of the task; otherwise a changed case would not make the task
    // out of date.
    testOptions {
        unitTests.all {
            testLogging {
                events = ["failed"]
                exceptionFormat = "full"
            }
            inputs.file('api/tests/options.json')
                    .withPropertyName('options')
                    .withPathSensitivity(PathSensitivity.RELATIVE)
        }
    }
}

// Nothing here differs between build types, so the release variant's copy of
// the same suite is duplicate work.
androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        variant.enableUnitTest = false
    }
}

dependencies {
    // A plain JVM, as in `control/`: the tests cover rules, in classes that
    // use no Android APIs.
    testImplementation 'junit:junit:4.13.2'
}

// What every protocol module's native build needs, so that a protocol's own
// build file says only what that protocol needs. `nativeAbis` is what a module
// *can* build; what a build *ships* is the app's `ndk.abiFilters`, a subset.
ext {
    cargoWorkspace = project.file('..')
    cargoRustToolchain = project.file('../rust-toolchain.toml')
    cargoNdkVersion = '4.1.2'
    // The linker's pin, taken by CargoBuildTask from each module's `ndkVersion`
    // rather than from the environment. r27 and later align to 16 KB by default.
    nativeNdkVersion = '28.2.13676358'
    nativeAbis = ['arm64-v8a', 'x86_64']
    // The Meson the C backends are built with, as its release tarball: the
    // version is an input of the libraries' bytes, so it is pinned exactly.
    // The project's meson.build sets the oldest version it accepts.
    mesonVersion = '1.11.2'
    mesonSha256 = '698feae069cef3ecd4d7aaf281d7df359bdfcf555a9a1564383d3b913fa8a736'
}

/*
 * The backend's description from Rust, as Java its module compiles:
 * `vento-codegen` (`platform/android/codegen/`) writes the backend's catalog
 * entry (id, name, description, position in a picker, and every option with
 * its key as a constant), and the module's provider answers from it. The
 * output is a generated source directory per variant, placed by AGP; none of
 * it is in the tree. `codegenSources` is everything the generator can depend
 * on, so the task is out of date exactly when the catalog may have changed.
 * That includes each backend's own entry, `modules/<name>/catalog.rs`, which
 * the `api` crate compiles by path from outside its own directory: without
 * it, a changed option would leave the Java catalog stale.
 */
ext.codegenSources = files(
        '../Cargo.toml', '../Cargo.lock', '../rust-toolchain.toml',
        'platform/android/codegen/Cargo.toml', 'platform/android/codegen/src',
        'api/Cargo.toml', 'api/build.rs', 'api/src',
        file('modules').listFiles().findAll { it.isDirectory() }.sort().collect { new File(it, 'catalog.rs') },
        'platform/android/Cargo.toml', 'platform/android/src',
        'runtime/Cargo.toml', 'runtime/src')

ext.generateCatalog = { Project module, variant, String backend, String className ->
    final cap = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) + variant.name.substring(1)
    final task = module.tasks.register("generate${cap}Catalog", GenerateJavaTask) {
        workspaceDir.set(cargoWorkspace)
        generatorSources.from(codegenSources)
        arguments.set(['catalog', backend, module.android.namespace, className])
    }
    variant.sources.java?.addGeneratedSourceDirectory(task) { it.outputDir }
}

/*
 * A Rust backend's natives class, `<className>` in the module's package: the
 * `native` methods of `NativeBackend.Natives`, from the JNI table in
 * `platform/android/src/surface.rs`, on a class that loads `library`. One per
 * module rather than one shared class because each library registers its
 * functions on a class from its `JNI_OnLoad`, and with two libraries
 * registering on one class, the last one loaded would handle calls for both.
 */
ext.generateNatives = { Project module, variant, String className, String library ->
    final cap = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) + variant.name.substring(1)
    final task = module.tasks.register("generate${cap}Natives", GenerateJavaTask) {
        workspaceDir.set(cargoWorkspace)
        generatorSources.from(codegenSources)
        arguments.set(['natives', module.android.namespace, className, library])
    }
    variant.sources.java?.addGeneratedSourceDirectory(task) { it.outputDir }
}

/*
 * Meson, unpacked from its pinned release tarball into the Gradle user home,
 * where every checkout shares it. A release runs from its own directory
 * (meson.py) with the python3 on the PATH.
 */
final mesonHome = new File(gradle.gradleUserHomeDir, "vento/meson-${mesonVersion}")
final fetchMeson = tasks.register('fetchMeson', DownloadSourceTarball) {
    group = 'build setup'
    description = "Unpacks Meson ${mesonVersion}, which builds the C backends."
    urls.set(["https://github.com/mesonbuild/meson/releases/download/${mesonVersion}/meson-${mesonVersion}.tar.gz".toString()])
    sha256.set(mesonSha256)
    stripComponents.set(1)
    outputDir.set(mesonHome)
}

/*
 * A C backend's native library, libremotedesktop_<backend>.so, which the
 * Meson build at the repository root makes for every ABI of each variant
 * (MesonBuildTask) and the module packages as its jniLibs. `crate` is the
 * module's crate (the backend as an `api::Backend` over the C library's
 * vtable, and the JNI layer in `platform/android` registered on the module's
 * natives class), which cargo-ndk builds first as a static library per ABI
 * for the library to link in; null for RealVNC's, which has no crate.
 *
 * The crate is built once for every variant, since each builds it
 * `--release` the same way.
 */
ext.nativeLibrary = { Project module, String backendName, String crate ->
    final ndk = module.androidComponents.sdkComponents.ndkDirectory
    final api = module.provider { minSdk(module) }
    final abis = nativeAbis
    final cargoNdk = cargoNdkVersion
    final strict = project.hasProperty('strictWarnings')
    def crateTask = null
    if (crate != null) {
        crateTask = module.tasks.register('cargoBuildStaticNative', CargoBuildTask) { task ->
            task.workspaceDir.set(cargoWorkspace)
            task.cargoPackage.set(crate)
            task.crateType.set('staticlib')
            task.ndkDirectory.set(ndk)
            task.rustToolchainFile.set(cargoRustToolchain)
            task.cargoNdkVersion.set(cargoNdk)
            task.abiFilters.set(abis)
            task.minSdkVersion.set(api)
            task.outputDir.set(module.layout.buildDirectory.dir('generated/rustStaticLibs'))
        }
    }
    module.androidComponents.onVariants(module.androidComponents.selector().all()) { variant ->
        final cap = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) + variant.name.substring(1)
        final mesonTask = module.tasks.register("mesonBuild${cap}", MesonBuildTask) { task ->
            task.dependsOn(fetchMeson)
            task.backend.set(backendName)
            task.abiFilters.set(abis)
            task.minSdkVersion.set(api)
            task.variant.set(variant.buildType == 'debug' ? 'debug' : 'release')
            task.strictWarnings.set(strict)
            if (crateTask != null) {
                task.crateLibraryDir.set(crateTask.flatMap { it.outputDir })
            }
            task.mesonDir.set(mesonHome)
            task.ndkDirectory.set(ndk)
            task.sourceDir.set(rootProject.layout.projectDirectory)
            task.buildDir.set(module.layout.buildDirectory.dir("meson/${variant.name}"))
            task.outputDir.set(module.layout.buildDirectory.dir("generated/mesonLibs/${variant.name}"))
        }
        variant.sources.jniLibs.addGeneratedSourceDirectory(mesonTask) { it.outputDir }
    }
}

static int minSdk(Project module) {
    final v = module.android.defaultConfig.minSdk
    return (v instanceof com.android.build.api.variant.AndroidVersion) ? v.apiLevel : v
}

/*
 * The C backends' compile commands for clangd, from one ABI and variant of the
 * four C modules' Meson trees, as one file:
 *
 *   ./gradlew :backends:exportCompileCommands [-Pabi=x86_64] [-Pvariant=release]
 *
 * written to build/compile_commands.json at the repository root, where clangd
 * finds it. A file two modules compile (libjpeg-turbo, GnuTLS and nettle are
 * in libvnc's and TigerVNC's) is written once. Run only when asked for.
 */
tasks.register('exportCompileCommands') {
    final abi = project.findProperty('abi') ?: 'arm64-v8a'
    final variant = project.findProperty('variant') ?: 'debug'
    final modules = ['libvnc', 'tigervnc', 'freerdp', 'realvnc']
    final out = rootProject.layout.buildDirectory.file('compile_commands.json')
    group = 'help'
    description = 'Writes the C backends\' compile commands for clangd to build/compile_commands.json.'
    dependsOn modules.collect { ":backends:${it}:mesonBuild${variant.substring(0, 1).toUpperCase(Locale.ROOT)}${variant.substring(1)}" }
    outputs.upToDateWhen { false }
    doLast {
        final entries = [:]
        modules.each { module ->
            final db = project(":backends:${module}").layout.buildDirectory
                    .file("meson/${variant}/${abi}/compile_commands.json").get().asFile
            if (!db.isFile()) {
                throw new GradleException("no ${db}: ${abi} is not one of nativeAbis (${nativeAbis.join(', ')})")
            }
            new groovy.json.JsonSlurper().parse(db).each { entry ->
                entries.putIfAbsent(new File(entry.directory as String, entry.file as String).canonicalPath, entry)
            }
        }
        final file = out.get().asFile
        file.parentFile.mkdirs()
        file.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries.values() as List)), 'UTF-8')
        logger.lifecycle("${entries.size()} files (${abi}, ${variant}) in ${file}")
    }
}

/*
 * The two upstreams that come as a release rather than as a submodule, both
 * used for TLS by the vendored VNC clients. Their git trees have no
 * `configure` (it is an autotools bootstrap output, and gnutls' bootstrap
 * needs gnulib and four host tools), so the release tarball, pinned by its
 * hash rather than by a gitlink, is the upstream source here.
 *
 * Their versions, hashes and mirrors are in `crypto-sources.txt`, which the
 * Linux Meson build reads too (`fetch-crypto-sources.py`): a Linux build
 * unpacks a missing tree itself, as the tasks here do. The Android build
 * fetches neither; `./gradlew fetchCryptoSources` does, and its Meson
 * configure fails with a message when a tree is missing.
 */
ext.cryptoSources = [:]
file('crypto-sources.txt').eachLine { line ->
    line = line.trim()
    if (!line || line.startsWith('#')) {
        return
    }
    final m = line =~ /^([a-z0-9]+)\.(version|sha256|url)\s*=\s*(\S+)$/
    if (!m.matches()) {
        throw new GradleException("crypto-sources.txt: not a `<name>.<key> = <value>` line: ${line}")
    }
    final pin = cryptoSources.computeIfAbsent(m.group(1)) { [urls: []] }
    if (m.group(2) == 'url') {
        pin.urls << m.group(3)
    } else {
        pin[m.group(2)] = m.group(3)
    }
}

def fetchTasks = cryptoSources.collect { name, pin ->
    tasks.register("fetch${name.capitalize()}Sources", DownloadSourceTarball) {
        group = 'build setup'
        description = "Unpacks ${name} ${pin.version} into third_party/${name}/."
        urls.set(pin.urls)
        sha256.set(pin.sha256)
        stripComponents.set(1)
        outputDir.set(rootProject.layout.projectDirectory.dir("third_party/${name}"))
    }
}

tasks.register('fetchCryptoSources') {
    group = 'build setup'
    description = 'Unpacks every upstream that arrives as a release tarball.'
    dependsOn fetchTasks
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

# The Linux parts of a backend that belong to no protocol, for the Linux
# client (`linux/`) and for the probes and tests: a video decoder (libavcodec,
# where the phone has the hardware's), so that a protocol sending video
# (RustDesk) can be shown, probed and tested on the development machine; and a
# sound output (where the phone has AAudio): a PipeWire stream
# (`src/pipewire.rs`, libpipewire-0.3 declared by hand and loaded at run time,
# never linked) or, without PipeWire, ALSA's default device (`src/alsa.rs`,
# libasound.so.2, declared and loaded the same way), with libavcodec's AAC and
# Opus decoders for compressed sound. Neither is needed to build or to start:
# without them the far end's sound is dropped and the log says why.
#
# The counterpart of `remotedesktop-platform-android`. On Android this crate is
# empty and has no dependencies, which keeps FFmpeg out of every APK and out of
# the licence page generated from the Android graph. A protocol crate depends
# on it only optionally, under `cfg(not(target_os = "android"))`, behind its
# `probe` feature.
#
# FFmpeg is built here: `build.rs` builds dav1d and a minimal FFmpeg from
# `third_party/` into OUT_DIR, statically, and the Linux client's C backends
# link the same build (`linux/build.rs` gets its location through the `links`
# key). Building it needs Meson, Ninja, make, pkg-config, a C compiler, and NASM
# on x86 for the decoders' assembly; no system FFmpeg.
#
# The rest of the Linux platform is beside the crate: `cpp/`, the C called by
# the Rust decoders and the stderr `vento_log` linked into each C backend;
# `meson.build`, a C backend's Linux half; and `probe/`, the
# development tools (the C probes' shared body and the two sound rigs).
[package]
name = "remotedesktop-platform-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"
links = "vento_video"

[lib]
name = "platform_linux"

[target.'cfg(not(target_os = "android"))'.dependencies]
log.workspace = true
# For `runtime::media`: the decoders and outputs here implement its
# `video::Decoders` and `audio::Outputs`.
remotedesktop-runtime.workspace = true
# No bindings to FFmpeg's API: `src/ffmpeg.rs` and `src/ffmpeg_audio.rs` call
# the functions of `cpp/vento_video.h` and `cpp/vento_ffaudio.h`, declared by
# hand, and only those C files include FFmpeg's headers, so nothing on the Rust
# side changes with an FFmpeg release.

# The two sound rigs in `probe/` (`scripts/testaudio/`), development tools
# built only on request: `cargo build --features probe --example audio_rig`.
# Examples by path, since they live beside the C probe's body rather than in
# `examples/`. Without the feature, `cargo test` and `clippy --all-targets`
# skip them.
[features]
probe = []

[[example]]
name = "audio_rig"
path = "probe/audio_rig/main.rs"
required-features = ["probe"]

[[example]]
name = "audio_pattern"
path = "probe/audio_pattern.rs"
required-features = ["probe"]

[build-dependencies]
# For the wrapper. Unconditional, since a build script is one program for
# every target; on Android it returns before using it.
cc = "1"

plugins {
    id 'com.android.library'
}

// Both halves of the RustDesk backend: `src/main/java` implements `Backend` on
// `src/main/rust`, our own client, and the AAR carries the library it compiles
// to. What ships it is `plugins/rustdesk` rather than the app.
android {
    namespace = 'net.pgaskin.remotedesktop.backend.rustdesk'
    compileSdk 36
    ndkVersion = project(':backends').nativeNdkVersion

    defaultConfig {
        minSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // The only thing of the app's this module may name. `api` because
    // `RustDeskBackend` is a `Backend` and whoever holds one says so.
    api project(':backends')
}

// `libremotedesktop_rustdesk.so`, compiled by cargo-ndk into a generated
// jniLibs directory the AAR packages — which the add-on's APK then carries and
// the app loads out of that package's own library directory.
androidComponents {
    onVariants(selector().all()) { variant ->
        final cap = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) + variant.name.substring(1)
        final seam = project(':backends')

        final cargoBuild = tasks.register("cargoBuild${cap}Native", CargoBuildTask) {
            workspaceDir.set(seam.cargoWorkspace)
            cargoPackage.set('remotedesktop-rustdesk')
            ndkDirectory.set(androidComponents.sdkComponents.ndkDirectory)
            rustToolchainFile.set(seam.cargoRustToolchain)
            cargoNdkVersion.set(seam.cargoNdkVersion)
            abiFilters.set(seam.nativeAbis)
            minSdkVersion.set(provider {
                final v = android.defaultConfig.minSdk
                (v instanceof com.android.build.api.variant.AndroidVersion) ? v.apiLevel : v
            })
            outputDir.set(layout.buildDirectory.dir("generated/rustNativeLibs/${variant.name}"))
        }
        variant.sources.jniLibs?.addGeneratedSourceDirectory(cargoBuild) { it.outputDir }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

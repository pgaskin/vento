plugins {
    id 'com.android.library'
}

// `Backend` implemented on somebody else's viewer core. A protocol module like
// the other two: `:realvnc-jni` holds the declarations, and what is here is
// ours — the session's lifecycle, the prompts, the options, and one small
// library that reads a counter their exported functions do not offer.
//
// Nothing of RealVNC's is in this or in anything built from it. It is the one
// backend that ships in an add-on rather than in the app, because everything
// which knows where their library comes from has to live somewhere the app is
// not.
android {
    namespace = 'net.pgaskin.remotedesktop.backend.realvnc'
    compileSdk 36
    ndkVersion = project(':backends').nativeNdkVersion

    defaultConfig {
        minSdk 34
        externalNativeBuild {
            cmake {
                targets 'remotedesktop_realvnc'
            }
        }
        ndk {
            abiFilters project(':backends').nativeAbis as String[]
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version = '3.30.5'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // The seam, and the only thing of the app's this module may name.
    api project(':backends')

    // Their JNI surface, and the pin on the build it binds to.
    api project(':realvnc-jni')

    // The add-on this ships inside, for the one thing it needs of it: the
    // library, which crosses from the add-on's uid to the app's.
    implementation project(':plugins')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

plugins {
    id 'com.android.library'
}

// Both halves of the libvncclient backend: `src/main/java` implements `Backend`
// on `src/main/cpp`, which is a shim over LibVNCServer's client, and the AAR
// carries the library CMake compiles them to.
//
// The one structural difference from the other protocol modules is that the
// native half is not in this directory: it is `third_party/libvncserver`, a
// submodule at the repository root, pinned by its gitlink and patched — if at
// all — from `patches/`.
android {
    namespace = 'net.pgaskin.remotedesktop.backend.libvnc'
    compileSdk 36
    ndkVersion = project(':backends').nativeNdkVersion

    defaultConfig {
        minSdk 34
        externalNativeBuild {
            cmake {
                targets 'remotedesktop_libvnc'
            }
        }
        ndk {
            abiFilters project(':backends').nativeAbis as String[]
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version = '3.30.5'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    api project(':backends')
}

// A build must not come out of sources that look pristine and are not, nor out
// of a submodule nobody has initialised.
def patchCheck = tasks.register('patchCheck', PatchCheckTask) {
    patchScript.set(rootProject.file('patch.sh'))
}

tasks.named('preBuild') {
    dependsOn patchCheck
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

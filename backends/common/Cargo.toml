# What a JNI half needs of Android and no protocol owns. Everything that is
# about TLS rather than about a phone is `remotedesktop-tls`, and why the two
# are separate crates is in that one's manifest.
[package]
name = "remotedesktop-common"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "common"

[dependencies]
log.workspace = true

# The `android` module is not compiled off Android, and this is all it needs.
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true

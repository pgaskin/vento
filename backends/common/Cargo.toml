# What more than one protocol needs and none owns, each here because the second
# protocol wanted it unchanged: `pinning` is what "trusted" means when nothing
# vouches for a remote desktop's certificate, and `android` is what a JNI half
# needs — a locked bitmap, the calls back into Java, a slot to park a protocol
# thread in until somebody answers a dialog.
[package]
name = "remotedesktop-common"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "common"

[dependencies]
log.workspace = true
sha2 = "0.11"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }

# The `android` module is not compiled off Android, and this is all it needs.
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true

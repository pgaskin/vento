name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev # needed by bindgen
      - run: ./patch.sh -n
      - run: rustup toolchain install # install the toolchain pinned by rust-toolchain.toml
      - run: cargo check --locked --verbose # default members (everything but remotedesktop-platform-linux)
      - run: cargo build --locked --verbose
      - run: cargo test --locked --verbose
      - run: cargo clippy --locked --verbose

  control:
    name: Control
    runs-on: ubuntu-latest
    steps:
      # self-contained, doesn't need ndk/rust/third_party
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - run: ./gradlew :control:test
      - run: tar -C control/build/reports -czf control-test-report.tar.gz tests
        if: failure()
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          path: control-test-report.tar.gz
          archive: false
          if-no-files-found: error
      - run: ./gradlew :control:assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          path: control/build/outputs/aar/control-release.aar
          archive: false
          if-no-files-found: error

  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses; ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager 'ndk;28.2.13676358' 'build-tools;36.0.0'
      - run: sudo apt-get update && sudo apt-get install -y ninja-build # for Meson, which Gradle fetches
      - run: ./patch.sh -n
      - run: ./gradlew :backends:fetchCryptoSources
      - run: rustup toolchain install
      - run: cargo install cargo-ndk@4.1.2
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
      - run: ./gradlew -p plugins assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          path: plugins/realvnc/build/outputs/apk/debug/realvnc-debug.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: plugins/rustdesk/build/outputs/apk/debug/rustdesk-debug.apk
          archive: false
          if-no-files-found: error
      #- run: ./scripts/check-jni-symbols.sh

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: git -C third_party/mcpelauncher-linker submodule update --init --depth 1 # need recursive submodules for mcpelauncher-linker
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev nasm ninja-build m4 zlib1g-dev
      - name: Install the Meson backends/build.gradle pins
        run: |
          set -euo pipefail
          version=$(sed -n "s/^ *mesonVersion *= *'\(.*\)'/\1/p" backends/build.gradle)
          sha256=$(sed -n "s/^ *mesonSha256 *= *'\(.*\)'/\1/p" backends/build.gradle)
          curl -fsSLo meson.tar.gz "https://github.com/mesonbuild/meson/releases/download/$version/meson-$version.tar.gz"
          echo "$sha256  meson.tar.gz" | sha256sum -c
          mkdir "$RUNNER_TEMP/meson" && tar -C "$RUNNER_TEMP/meson" --strip-components=1 -xf meson.tar.gz
          echo "MESON=$RUNNER_TEMP/meson/meson.py" >> "$GITHUB_ENV"
      - run: ./patch.sh -n
      - run: rustup toolchain install # install the toolchain pinned by rust-toolchain.toml
      - run: cargo check --locked --manifest-path linux/Cargo.toml --verbose
      - run: cargo build --locked --manifest-path linux/Cargo.toml --verbose
      - run: cargo test --locked --manifest-path linux/Cargo.toml --verbose
      - run: cargo clippy --locked --manifest-path linux/Cargo.toml --verbose
      - run: cargo test --locked -p remotedesktop-platform-linux --verbose
      - run: cargo clippy --locked -p remotedesktop-platform-linux --verbose
      - run: set -euo pipefail && linux/target/debug/vento --list | tee backends.txt && test "$(grep -c '^[a-z]* .*/linux/target/debug/lib/libvento_[a-z]*\.so$' backends.txt)" = 4 && ! grep -F '(error:' backends.txt

  linux-standalone:
    name: Linux (standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: git -C third_party/mcpelauncher-linker submodule update --init --depth 1 # for realvnc's host half
      - run: docker build -f linux/Dockerfile --output type=local,dest=dist/vento .
      - run: tar -C dist --sort=name --owner=0 --group=0 --numeric-owner --mode=u+rwX,go+rX,go-w -czf vento-x86_64-linux-gnu.tar.gz vento
      - uses: actions/upload-artifact@v7
        with:
          path: vento-x86_64-linux-gnu.tar.gz
          archive: false
          if-no-files-found: error

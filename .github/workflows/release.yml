name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Check version
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const dryRun = context.eventName === 'workflow_dispatch'
            const fail = (message) => { if (dryRun) core.warning(message); else throw new Error(message) }
            const gradle = fs.readFileSync('app/build.gradle', 'utf8')
            const versionName = gradle.match(/^\s*versionName\s+(['"])([^'"]+)\1/m)?.[2]
            const versionCode = gradle.match(/^\s*versionCode\s+([0-9]+)/m)?.[1]
            if (!versionName) fail('missing versionName in app/build.gradle')
            if (!versionCode) fail('missing versionCode in app/build.gradle')
            const tag = context.ref.replace(/^refs\/tags\//, '')
            if (versionName !== versionCode) fail(`versionName (${versionName}) does not match versionCode (${versionCode})`)
            if (tag !== `v${versionName}`) fail(`tag (${tag}) does not match versionName (${versionName})`)
            if (!fs.existsSync(`app/fastlane/metadata/android/en-US/changelogs/${versionCode}.txt`)) fail(`missing changelog for versionCode ${versionCode}`)
            const assets = {
              /* also needs to be in sign/verify/upload steps */
              realvnc: 'vento-rvnc.apk',
              rustdesk: 'vento-rustdesk.apk',
            }
            const plugins = fs.readdirSync('plugins', {withFileTypes: true})
              .filter(e => e.isDirectory() && fs.existsSync(`plugins/${e.name}/build.gradle`))
              .map(e => e.name)
            if (!plugins.length) fail('nothing in plugins/')
            for (const name of plugins) {
              const plugin = fs.readFileSync(`plugins/${name}/build.gradle`, 'utf8')
              const pluginCode = plugin.match(/^\s*versionCode\s+([0-9]+)/m)?.[1]
              if (pluginCode !== versionCode) fail(`the ${name} plugins's versionCode (${pluginCode}) does not match the app's (${versionCode})`)
              if (!fs.existsSync(`plugins/${name}/fastlane/metadata/android/en-US/changelogs/${versionCode}.txt`)) fail(`missing changelog for the ${name} plugin's versionCode ${versionCode}`)
              if (!assets[name]) fail(`the ${name} plugin has no release asset name`)
            }
            const linuxVersion = fs.readFileSync('linux/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)?.[1]
            if (!linuxVersion) fail('missing version in linux/Cargo.toml')
            else if (linuxVersion !== `0.0.${versionCode}`) fail(`linux/Cargo.toml's version (${linuxVersion}) does not match versionCode (${versionCode}), expected 0.0.${versionCode}`)
            const linuxLockVersion = fs.readFileSync('linux/Cargo.lock', 'utf8').match(/^name = "vento"\nversion = "([^"]+)"/m)?.[1]
            if (!linuxLockVersion) fail('missing vento package in linux/Cargo.lock')
            else if (linuxLockVersion !== linuxVersion) fail(`linux/Cargo.lock's vento version (${linuxLockVersion}) does not match linux/Cargo.toml's (${linuxVersion})`)
            core.setOutput('name', versionName)
            core.setOutput('code', versionCode)
            core.setOutput('tag', tag)

  linux:
    name: Linux
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: git -C third_party/mcpelauncher-linker submodule update --init --depth 1 # for realvnc's host half
      - run: docker build -f linux/Dockerfile --output type=local,dest=dist/vento .
      - run: test "$(dist/vento/vento --version)" = "vento v${{ needs.version.outputs.name }}"
      - run: tar -C dist --sort=name --owner=0 --group=0 --numeric-owner --mode=u+rwX,go+rX,go-w -czf "vento-v${{ needs.version.outputs.name }}-x86_64-linux-gnu.tar.gz" vento
      - uses: actions/upload-artifact@v7
        with:
          path: vento-v${{ needs.version.outputs.name }}-x86_64-linux-gnu.tar.gz
          archive: false
          retention-days: 1
          if-no-files-found: error

  android:
    name: Android
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # must match app/build.gradle's Java toolchain and F-Droid's
          # buildserver JDK: javac's lambda naming (and thus the dex) differs
          # between JDK <=21 and 22+, so a mismatch breaks reproducibility.
          java-version: '21'
          cache: gradle
      - run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses; ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager 'cmake;3.30.5' 'ndk;28.2.13676358' 'build-tools;36.0.0'
      - run: ./patch.sh -n
      - run: ./gradlew :backends:fetchCryptoSources
      - run: rustup toolchain install # install the toolchain pinned by rust-toolchain.toml
      - run: cargo install cargo-ndk@4.1.2
      - run: ./gradlew :app:assembleRelease :plugins:realvnc:assembleRelease :plugins:rustdesk:assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: android-release-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            plugins/realvnc/build/outputs/apk/release/realvnc-release-unsigned.apk
            plugins/rustdesk/build/outputs/apk/release/rustdesk-release-unsigned.apk
          retention-days: 1
          if-no-files-found: error

  android-rebuild:
    name: Android (rebuild)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # must match app/build.gradle's Java toolchain and F-Droid's
          # buildserver JDK: javac's lambda naming (and thus the dex) differs
          # between JDK <=21 and 22+, so a mismatch breaks reproducibility.
          java-version: '21'
          cache: gradle
      - run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses; ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager 'cmake;3.30.5' 'ndk;28.2.13676358' 'build-tools;36.0.0'
      - run: ./patch.sh -n
      - run: ./gradlew :backends:fetchCryptoSources
      - run: rustup toolchain install # install the toolchain pinned by rust-toolchain.toml
      - run: cargo install cargo-ndk@4.1.2
      - name: Rebuild at a different path
        # Rebuild from a copy at a different absolute path (a reproducible build
        # must not depend on the checkout location). The release job compares
        # it with the android job's build.
        run: |
          set -euo pipefail
          rebuild=/tmp/vento-rebuild-at-a-different-path
          rsync -a --delete \
            --exclude='/target/' \
            --exclude='build/' \
            --exclude='.cxx/' \
            --exclude='.gradle/' \
            ./ "$rebuild/"
          ( cd "$rebuild" && ./gradlew --no-daemon :app:assembleRelease :plugins:realvnc:assembleRelease :plugins:rustdesk:assembleRelease )
      - uses: actions/upload-artifact@v7
        with:
          name: android-release-unsigned-rebuild
          path: |
            /tmp/vento-rebuild-at-a-different-path/app/build/outputs/apk/release/app-release-unsigned.apk
            /tmp/vento-rebuild-at-a-different-path/plugins/realvnc/build/outputs/apk/release/realvnc-release-unsigned.apk
            /tmp/vento-rebuild-at-a-different-path/plugins/rustdesk/build/outputs/apk/release/rustdesk-release-unsigned.apk
          retention-days: 1
          if-no-files-found: error

  release:
    environment:
      name: release
      deployment: false
    needs: [version, linux, android, android-rebuild]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-release-unsigned
      - uses: actions/download-artifact@v8
        with:
          name: android-release-unsigned-rebuild
          path: rebuild
      - uses: actions/download-artifact@v8
        with:
          name: vento-v${{ needs.version.outputs.name }}-x86_64-linux-gnu.tar.gz
      - run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses; ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager 'build-tools;36.0.0'

      - name: Verify reproducible build
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/release/app-release-unsigned.apk \
                     plugins/realvnc/build/outputs/apk/release/realvnc-release-unsigned.apk \
                     plugins/rustdesk/build/outputs/apk/release/rustdesk-release-unsigned.apk; do
            go run scripts/check-reproducible.go "$apk" "rebuild/$apk"
          done

      - name: Write keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Sign APK
        run: |
          set -euo pipefail
          for spec in "app/build/outputs/apk/release/app-release-unsigned.apk Vento.apk" \
                      "plugins/realvnc/build/outputs/apk/release/realvnc-release-unsigned.apk vento-rvnc.apk" \
                      "plugins/rustdesk/build/outputs/apk/release/rustdesk-release-unsigned.apk vento-rustdesk.apk"; do
            set -- $spec
            $ANDROID_HOME/build-tools/36.0.0/apksigner sign --v1-signing-enabled false --alignment-preserved --ks "$KEYSTORE_PATH" --ks-pass env:KEYSTORE_PASSWORD --in "$1" --out "$2"
          done
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - name: Verify APK signatures
        run: |
          set -euo pipefail
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs Vento.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs vento-rvnc.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs vento-rustdesk.apk

      - name: Verify reproducible signed APKs
        run: |
          set -euo pipefail
          go run scripts/check-reproducible.go Vento.apk rebuild/app/build/outputs/apk/release/app-release-unsigned.apk
          go run scripts/check-reproducible.go vento-rvnc.apk rebuild/plugins/realvnc/build/outputs/apk/release/realvnc-release-unsigned.apk
          go run scripts/check-reproducible.go vento-rustdesk.apk rebuild/plugins/rustdesk/build/outputs/apk/release/rustdesk-release-unsigned.apk

      - name: Create release
        id: create-release
        if: github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const tag = ${{ toJSON(needs.version.outputs.tag) }}
            const versionCode = ${{ toJSON(needs.version.outputs.code) }}
            const {data: {id: id}} = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              body: require('fs').readFileSync(`app/fastlane/metadata/android/en-US/changelogs/${versionCode}.txt`, 'utf8'),
              draft: true,
            })
            core.setOutput('id', id)
      - name: Upload Android release assets
        if: github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            for (const name of ['Vento.apk', 'vento-rvnc.apk', 'vento-rustdesk.apk']) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: ${{ toJSON(steps.create-release.outputs.id) }},
                data: require('fs').readFileSync(name),
                name: name,
              })
            }
      - name: Upload Linux release assets
        if: github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const versionName = ${{ toJSON(needs.version.outputs.name) }}
            const name = `vento-v${versionName}-x86_64-linux-gnu.tar.gz`
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ toJSON(steps.create-release.outputs.id) }},
              data: require('fs').readFileSync(name),
              name: name,
            })

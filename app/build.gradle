plugins {
    id 'com.android.application'
}

// What ships, in one APK for every architecture rather than one per. An
// emulator and a phone are then the same file, which is what
// `scripts/session.sh` and every `installDebug` assume, and one APK is one
// versionCode, which is what a build server that republishes this wants.
//
// The cost is only the other architecture's libraries, and as of ed0b535 a
// universal freeRelease APK is 31.7 MB: 9.9 MB of arm64-v8a, 10.3 MB of
// x86_64, and 11.5 MB that is neither. Splitting would save a phone 10.3 MB of
// a 31.7 MB download and cost every consumer of this build a second artefact,
// while also making versioning more complicated.
final shippedAbis = ['arm64-v8a', 'x86_64']

android {
    namespace = 'net.pgaskin.remotedesktop'
    compileSdk 36

    defaultConfig {
        applicationId "net.pgaskin.remotedesktop"
        minSdk 34
        targetSdk 36
        versionCode 1
        versionName "1"

        // The last word on what ships: packaging drops any ABI a module
        // supplies and this does not name, so it must be a subset of every
        // backend's — a library with no RealVNC one beside it fails at
        // System.loadLibrary on a device nobody here has.
        ndk {
            abiFilters(*shippedAbis)
        }
    }

    // Everything of RealVNC's is one dependency and one flavour leaves it out,
    // so `freeDebug` contains none of it and a dependency line is the whole of
    // the enforcement. Neither flavour has any source of its own.
    flavorDimensions += 'licensing'
    productFlavors {
        free {
            dimension 'licensing'
        }
        nonfree {
            dimension 'licensing'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Otherwise the git HEAD is stamped into the APK, so the same
            // sources at two commits differ.
            vcsInfo.include = false
        }
    }

    // A Google-signed blob of the dependency tree, in a signing block of its
    // own. It is not reproducible from the sources, and F-Droid rejects a
    // signing block it does not recognise.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packaging {
        jniLibs {
            // Unpacked at install time rather than mapped out of the APK, which
            // costs disk and makes a library's own alignment the loader's
            // problem instead of the packager's — one of these is somebody
            // else's build and cannot be rebuilt to suit ours.
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // The input stack, from `control/`. Its tests live with it, which is why
    // this module has none.
    implementation project(':control')

    // The seam, and the protocols this build has: each carries its own native
    // library and declares itself as a `BackendProvider` service, so these
    // lines are the whole of what this app can connect with. Nothing in the
    // app names a protocol.
    implementation project(':backends')
    implementation project(':backends:rfb')
    implementation project(':backends:libvnc')
    implementation project(':backends:tigervnc')
    implementation project(':backends:rdp')
    implementation project(':backends:freerdp')

    // Their backend, and behind it the JNI surface and libvncviewer.so itself.
    nonfreeImplementation project(':backends:realvnc')

    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.13.0'
}

// The licence page, as an asset: what this build is made of and what that means
// for handing it on. The crates are resolved from the Cargo workspace rather
// than named, per ABI, so a protocol added or deleted changes nothing here.
def rustAbiFilters = provider { shippedAbis as Set }

androidComponents {
    onVariants(selector().all()) { variant ->
        final cap = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) + variant.name.substring(1)

        final nonfree = variant.flavorName == 'nonfree'
        final backends = project(':backends')
        final genLicenses = tasks.register("generate${cap}Licenses", GenerateLicensesTask) {
            cargoLock.set(rootProject.file('Cargo.lock'))
            workspaceDir.set(backends.cargoWorkspace)
            abiFilters.set(rustAbiFilters)
            firstParty.set(provider {
                final modules = [[
                        name: 'control — the input stack',
                        spdx: 'MIT',
                        text: rootProject.file('control/LICENSE').getText('UTF-8'),
                ], [
                        name: 'the app and its protocol clients',
                        spdx: 'GPL-3.0-or-later',
                        text: rootProject.file('LICENSE').getText('UTF-8'),
                ]]
                if (nonfree) {
                    modules << [
                            name: 'realvnc-jni — RealVNC\'s JNI surface',
                            spdx: 'CC0-1.0',
                            text: rootProject.file('realvnc/LICENSE').getText('UTF-8'),
                    ]
                }
                modules
            })
            // The Cargo lock accounts for every Rust protocol module and for
            // nothing under a CMake one nor anything in `dependencies` above,
            // so what those are built from is named here or the page would not
            // know it is in the build.
            otherComponents.set(provider {
                // Read through a helper rather than getText directly: on a
                // clean clone the submodules are empty and the two crypto trees
                // are not there at all, and the first thing that says so should
                // be an instruction rather than a FileNotFoundException from a
                // provider halfway through configuration.
                final Closure<String> licenceText = { String path ->
                    final File f = rootProject.file(path)
                    if (!f.isFile()) {
                        throw new GradleException(
                                "${path} is missing. Run `git submodule update --init` and, for "
                                        + "the gnutls and nettle trees, `./gradlew :backends:fetchCryptoSources`.")
                    }
                    f.getText('UTF-8')
                }
                [[
                        name: 'LibVNCServer — libvncclient',
                        spdx: 'GPL-2.0-or-later',
                        text: licenceText('third_party/libvncserver/COPYING'),
                ], [
                        name: 'TigerVNC',
                        spdx: 'GPL-2.0-or-later',
                        text: licenceText('third_party/tigervnc/LICENCE.TXT'),
                ], [
                        // The library half, which is all this build compiles;
                        // their command-line tools are GPL-3.0 and are not here.
                        name: 'GnuTLS',
                        spdx: 'LGPL-2.1-or-later',
                        text: licenceText('third_party/gnutls/COPYING.LESSERv2'),
                ], [
                        // Dual licensed; either arm covers a GPL-2.0-or-later
                        // build, and the second is the one that also covers a
                        // build under no other terms.
                        name: 'Nettle',
                        spdx: 'LGPL-3.0-or-later OR GPL-2.0-or-later',
                        text: licenceText('third_party/nettle/COPYING.LESSERv3')
                                + '\n\n' + licenceText('third_party/nettle/COPYINGv2'),
                ], [
                        name: 'pixman',
                        spdx: 'MIT',
                        text: licenceText('third_party/pixman/COPYING'),
                ], [
                        name: 'libjpeg-turbo',
                        spdx: 'IJG AND BSD-3-Clause AND Zlib',
                        text: licenceText('third_party/libjpeg-turbo/LICENSE.md')
                                + '\n\n' + licenceText('third_party/libjpeg-turbo/README.ijg'),
                ], [
                        name: 'FreeRDP',
                        spdx: 'Apache-2.0',
                        text: licenceText('third_party/freerdp/LICENSE'),
                ], [
                        // FreeRDP's crypto, and the only library here with two
                        // licences in one file: the Apache-2.0 this build is
                        // under, and the old dual licence for versions before
                        // 3.0, which this is not.
                        name: 'OpenSSL',
                        spdx: 'Apache-2.0',
                        text: licenceText('third_party/openssl/LICENSE.txt'),
                ], [
                        // The Java side, which arrives from Maven rather than
                        // from a submodule and so is in no lock file this page
                        // reads. It is one entry because it is one licence and
                        // one text; the versions are in `dependencies` above.
                        // The text is spelled out rather than read from a file
                        // because there is nowhere honest to read it from: of
                        // the three artifacts only RecyclerView's carries a
                        // copy, and that one stops at END OF TERMS AND
                        // CONDITIONS with the appendix cut off.
                        name: 'androidx (RecyclerView, Preference) and Material Components',
                        spdx: 'Apache-2.0',

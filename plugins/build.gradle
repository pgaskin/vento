plugins {
    id 'com.android.library'
}

// The add-on side of the contract whose app side is in `:backends`: where a
// verified file is stored, how it is passed from one uid to the other, and the
// layout of the screen that obtains it. It has one consumer so far, and is a
// separate module for the same reason `:backends` is: a contract kept inside
// its only implementation is not enforced.
android {
    namespace = 'net.pgaskin.remotedesktop.plugin'
    compileSdk 36

    defaultConfig {
        minSdk 31
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    // For the discovery action and, in the app's process, finding which add-on
    // a class was loaded from. Nothing here depends on a protocol.
    api project(':backends')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

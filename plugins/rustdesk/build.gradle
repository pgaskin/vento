plugins {
    id 'com.android.application'
}

// The second add-on: the RustDesk backend and the library it compiles to, and
// nothing else. It is an add-on for a **distribution** reason rather than a
// legal one: the licence allows this code in the app, but F-Droid's
// anti-features attach to a listing, and a client that talks to a third-party
// rendezvous network would put one on the app's listing for one backend of
// seven. As an add-on it gets its own listing, where the anti-feature does not
// matter.
//
// It is also the first add-on that is **only an APK to install**: no setup
// screen, no provider, nothing downloaded on the phone. It carries its own
// shared library, which the app loads from this package's library directory.
android {
    namespace = 'net.pgaskin.remotedesktop.rustdesk'
    compileSdk 36

    defaultConfig {
        applicationId "net.pgaskin.remotedesktop.rustdesk"
        minSdk 34
        targetSdk 36
        // Checked for equality against the app's before this APK's dex is
        // loaded: the interface between the two is a set of Java interfaces
        // with no stability guarantee between releases, so they ship together.
        versionCode 7
        versionName "7"

        // Where to find the build of this add-on for another version of the
        // app, and the certificate that file is signed with: meta-data in this
        // APK's manifest, since the app reads it from a package whose dex it
        // has refused to load. `{versionCode}` is the app's, filled in by the
        // app: the release tag is `v<versionCode>` because the release workflow
        // refuses to publish a release where the two differ.
        //
        // The fingerprint is the release keystore's certificate, as `apksigner
        // verify --print-certs` prints it. It is here rather than passed in by
        // the workflow that holds the key, so that what an installed APK claims
        // about a download can be checked in this repository. The app follows
        // it only if it is the key the app itself is signed with, which is
        // what makes the claim trustworthy: the installer refuses a file signed
        // with any other key.
        manifestPlaceholders = [
                updateUrl      : 'https://github.com/pgaskin/vento/releases/download/v{versionCode}/vento-rustdesk.apk',
                updateSignature: '08d46917a818ad0c479733b458acb7488a4cc39f0a5a20ccc6a39181b2fb8f55',
        ]

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            vcsInfo.include = false
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packaging {
        jniLibs {
            // The app loads this APK's dex with `nativeLibraryDir` as its
            // library path, and that directory is only populated when the
            // libraries are unpacked at install time.
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // The backend interface, which the app also has: loaded parent-first, so
    // both sides use the same `Backend` class.
    implementation project(':backends')

    // The marker service the app discovers this package by.
    implementation project(':plugins')

    // The backend this add-on carries.
    implementation project(':backends:rustdesk')
}

// This APK carries third-party protocol definitions and dependencies the app
// does not have, so it lists them in its own page rather than the app's.
apply from: rootProject.file('plugins/licenses.gradle')
licensePage(
        cargoPackages: ['remotedesktop-rustdesk'],
        firstParty: [[
                name: 'backends',
                spdx: 'GPL-3.0-or-later',
                text: rootProject.file('LICENSE').getText('UTF-8'),
        ], [
                name: 'plugins',
                spdx: 'GPL-3.0-or-later',
                text: rootProject.file('LICENSE').getText('UTF-8'),
        ]],
        otherComponents: provider { [[
                // RustDesk's peer-to-peer message definitions,
                // libs/base/protos/message.proto in RustDesk's own repository,
                // compiled into this build. AGPL-3.0 by its LICENCE file;
                // "only" is from its Flatpak metadata
                // (flatpak/com.rustdesk.RustDesk.metainfo.xml).
                name: 'RustDesk (message definitions)',
                spdx: 'AGPL-3.0-only',
                text: GenerateLicensesTask.licenceText(project, 'third_party/rustdesk/LICENCE'),
        ], [
                // RustDesk's rendezvous and relay message definitions,
                // protos/rendezvous.proto in hbb_common, compiled into this
                // build. That repository has **no licence file**, so the
                // licence is that of the project it belongs to, whose text is
                // RustDesk's LICENCE above. Upstream has been asked to add one.
                name: 'RustDesk hbb_common (rendezvous definitions)',
                spdx: 'AGPL-3.0-only, by inheritance from RustDesk: the repository states no licence of its own',
                text: GenerateLicensesTask.licenceText(project, 'third_party/rustdesk/LICENCE'),
        ]] })

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

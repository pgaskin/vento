plugins {
    id 'com.android.application'
}

// The RealVNC add-on: RealVNC's backend, the JNI surface under it, and the
// screen that acquires RealVNC's library on the phone. Nothing of RealVNC's is
// in this APK either; it is a separate artefact because all code that *knows*
// about RealVNC is in it, so the app names no protocol and carries no
// downloader for a third-party binary.
android {
    namespace = 'net.pgaskin.remotedesktop.realvnc'
    compileSdk 36

    defaultConfig {
        applicationId "net.pgaskin.remotedesktop.realvnc"
        minSdk 34
        targetSdk 36
        // Checked for equality against the app's before this APK's dex is
        // loaded: the `:backends` interfaces the two share have no stability
        // guarantee across releases, so they ship together.
        versionCode 7
        versionName "7"

        // Where the build of this add-on for another version of the app is, and
        // the key the file there is signed with: meta-data in this APK's
        // manifest, since the app reads it from a package whose dex it has
        // refused to load. `{versionCode}` is the app's own, filled in by the
        // app: the release tag is `v<versionCode>` because the release workflow
        // refuses to publish a release where the two differ.
        //
        // The fingerprint is the release keystore's certificate, as `apksigner
        // verify --print-certs` prints it. It is here rather than passed in by
        // the workflow holding the key, so that what an installed APK claims
        // about a download can be read in this repository. The app follows it
        // only where it is the key the app itself is signed with, which is what
        // makes the claim meaningful: the installer refuses a file signed with
        // another key.
        manifestPlaceholders = [
                updateUrl      : 'https://github.com/pgaskin/vento/releases/download/v{versionCode}/vento-rvnc.apk',
                updateSignature: '08d46917a818ad0c479733b458acb7488a4cc39f0a5a20ccc6a39181b2fb8f55',
        ]

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            vcsInfo.include = false
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packaging {
        jniLibs {
            // The app loads this APK's dex with `nativeLibraryDir` as its
            // library path, and that directory is only populated when the
            // libraries are unpacked at install time.
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // The backend interface, which the app also has: loaded parent-first, so
    // both sides use the same `Backend` class.
    implementation project(':backends')

    // The add-on side of the arrangement: the setup screen's shape, the
    // provider, and the verified store behind both.
    implementation project(':plugins')

    // The backend this add-on carries.
    implementation project(':backends:realvnc')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

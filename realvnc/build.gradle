// SPDX-License-Identifier: CC0-1.0

plugins {
    id 'com.android.library'
}

// Declarations and nothing else. The library they bind to is in no artefact
// this builds: `Library` says which build of it they were read from, and
// whoever acquires a copy checks it against that.
android {
    namespace = 'com.realvnc.vncviewer.jni'
    compileSdk 36

    defaultConfig {
        minSdk 34
        // The whole package is names the native side resolves at run time.
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

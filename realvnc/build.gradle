// SPDX-License-Identifier: CC0-1.0

plugins {
    id 'com.android.library'
}

// Declarations only. The library they bind to is in no artefact this module
// builds: `Library` names the build they were read from, and code that
// acquires a copy checks it against that.
android {
    namespace = 'com.realvnc.vncviewer.jni'
    compileSdk 36

    defaultConfig {
        minSdk 31
        // The native side resolves every name in the package at run time.
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
